<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#5b4bd6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Блокнот"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Блокнот — заметки</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#25213a;--mut:#7d778f;--line:#e9e1d5;--acc:#5b4bd6;--acc2:#ff7a59;--h:#e5484d;--m:#f5a524;--l:#30a46c;--sh:0 6px 24px rgba(60,40,90,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--card:#1e1b2c;--ink:#efeaf8;--mut:#9a94b0;--line:#2e2a42;--acc:#9d8cff;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131f;--card:#1e1b2c;--ink:#efeaf8;--mut:#9a94b0;--line:#2e2a42;--acc:#9d8cff;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100%;display:grid;grid-template-columns:1fr}
#side,#ed{height:100%;overflow:auto;min-width:0}
#app[data-v=list] #ed,#app[data-v=ed] #side{display:none}
@media(min-width:860px){#app{grid-template-columns:380px 1fr}#app[data-v] #ed,#app[data-v] #side{display:block}.back{display:none!important}}
.hero{position:relative;padding:22px 18px 54px;color:#fff;background:linear-gradient(135deg,#5b4bd6,#b05cd8 55%,#ff7a59);overflow:hidden}
.hero svg{position:absolute;inset:auto 0 0 0;width:100%;height:70px}
.hero h1{font:700 30px Fraunces,Georgia,serif;margin:0;position:relative}
.hero p{margin:2px 0 0;opacity:.85;position:relative}
.hero .acts{position:absolute;right:14px;top:16px;display:flex;gap:8px;z-index:2}
.ib{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);color:#fff;font-size:18px}
.pad{padding:0 14px}
.search{margin:-24px 14px 10px;position:relative;z-index:3}
.search input{width:100%;padding:13px 16px;border-radius:16px;border:0;background:var(--card);color:var(--ink);box-shadow:var(--sh);font:inherit;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:flex;margin:0 14px 12px;background:var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:7px;border-radius:10px;color:var(--mut)}.seg .on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.card{margin:0 14px 10px;padding:13px 15px;background:var(--card);border-radius:16px;box-shadow:var(--sh);border-left:5px solid var(--l);cursor:pointer}
.card.p3{border-color:var(--h)}.card.p2{border-color:var(--m)}.card.sel{outline:2px solid var(--acc)}
.card b{display:block;font-weight:600}.card small{color:var(--mut)}
.card .pv{color:var(--mut);font-size:13px;max-height:2.9em;overflow:hidden}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
#cal{margin:0 14px 12px;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.cn{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px}
.cn button{width:34px;height:34px;border-radius:10px;background:var(--line)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cg i{font-style:normal;color:var(--mut);font-size:11px}
.cg button{aspect-ratio:1;border-radius:11px;position:relative;font-size:13px}
.cg button.td{color:var(--acc2);font-weight:700}.cg button.on{background:var(--acc);color:#fff}
.cg button b{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc2)}
#ed{background:var(--card)}
.top{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.top select,.top input{padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.top .sp{flex:1}.btn{padding:8px 13px;border-radius:11px;background:var(--acc);color:#fff;font-size:13px}
.btn.g{background:var(--line);color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:14px 18px 80px}
#ttl{width:100%;border:0;outline:0;background:none;color:var(--ink);font:700 28px Fraunces,Georgia,serif;padding:6px 0}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:10px}
.tools button{min-width:36px;height:34px;padding:0 9px;border-radius:9px;background:var(--bg);font-size:13px}
#body{min-height:50vh;outline:0;font-size:16px;line-height:1.65}
#body h2{font:700 21px Fraunces,Georgia,serif;margin:.8em 0 .3em}
#body table{border-collapse:collapse;width:100%;margin:10px 0}
#body td{border:1px solid var(--line);padding:7px 9px;min-width:60px}
#body tr:first-child td{background:var(--bg);font-weight:600}
#body ul.chk{list-style:none;padding-left:4px}
#body ul.chk li{padding-left:30px;position:relative}
#body ul.chk li:before{content:"";position:absolute;left:2px;top:.4em;width:17px;height:17px;border:2px solid var(--acc);border-radius:6px}
#body ul.chk li.done{color:var(--mut);text-decoration:line-through}
#body ul.chk li.done:before{background:var(--acc)}
.none{display:flex;height:100%;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:30px}
.ov{position:fixed;inset:0;background:rgba(10,8,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.show{display:flex}.sheet{width:100%;max-width:440px;background:var(--card);border-radius:22px 22px 0 0;padding:18px;display:grid;gap:9px}
.sheet h3{margin:0 0 4px;font:700 20px Fraunces,serif}.sheet .btn{padding:13px;text-align:left}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:60;font-size:14px}
#pdf{position:fixed;left:-9999px;top:0;width:700px;background:#fff;color:#111;padding:30px;font:15px/1.6 Inter,Arial,sans-serif}
#pdf td{border:1px solid #bbb;padding:5px 8px}#pdf table{border-collapse:collapse;width:100%}#pdf h2{font-size:20px}
.tg{width:100%;border:0;outline:0;background:none;color:var(--acc);font:inherit;font-size:13px;padding:2px 0 8px}.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.th>div{position:relative;height:96px;border-radius:12px;overflow:hidden;background:var(--bg)}.th img{width:100%;height:100%;object-fit:cover}.th span{position:absolute;bottom:3px;left:4px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 5px}.th button{position:absolute;top:3px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;width:26px;height:26px}.sheet select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}.sheet input:not([type=checkbox]){padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}</style></head><body>
<div id="app" data-v="list">
<aside id="side">
 <div class="hero">
  <div class="acts"><button class="ib" id="stb" title="Настройки">⚙</button><button class="ib" id="scb" title="Сканер">📷</button><button class="ib" id="imp" title="Импорт">⬆</button><button class="ib" id="expAll" title="Экспорт всего">⬇</button><button class="ib" id="new" title="Новая заметка">＋</button></div>
  <h1>Блокнот</h1><p id="cnt"></p>
  <svg viewBox="0 0 400 70" preserveAspectRatio="none"><path d="M0 70V40Q60 5 130 35T260 30T400 20V70Z" fill="var(--bg)" opacity=".5"/><path d="M0 70V52Q90 20 180 48T400 38V70Z" fill="var(--bg)"/></svg>
 </div>
 <div class="search"><input id="q" placeholder="Поиск по заметкам…"></div>
 <div class="chips" id="chips"></div>
 <div class="seg"><button id="tl" class="on">Заметки</button><button id="tc">Календарь</button></div>
 <div id="cal" hidden></div>
 <div id="list"></div>
 <input type="file" id="file" multiple accept=".json,.txt,.md,.csv,.docx" hidden>
</aside>
<main id="ed"><div class="none" id="none">Выберите заметку или создайте новую ＋</div></main>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="sov"><div class="sheet" id="scan" style="max-width:560px;max-height:92vh;overflow:auto"></div></div><input type="file" id="fcam" accept="image/*" capture="environment" hidden><input type="file" id="fgal" accept="image/*" multiple hidden>
<div id="toast"></div><div id="pdf"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),KEY='notes-v1',PN={3:'Высокий',2:'Средний',1:'Низкий'};
let notes=[],sel=null,flt='all',day=null,q='',tab='list',cm=new Date();cm.setDate(1);let tagf=null,cloud='',col=null,synced={},tomb={};try{tomb=JSON.parse(localStorage.getItem('notes-del')||'{}')}catch(e){}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
function load(){try{notes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){notes=[]}
 if(!notes.length)notes=[{id:'w1',title:'Добро пожаловать 👋',pri:2,date:today(),time:'',upd:1,html:'<h2>Что умеет блокнот</h2><ul><li>Списки, чек-листы и таблицы</li><li>Приоритеты и привязка к календарю</li><li>Экспорт в PDF, Word, Excel и импорт файлов</li></ul><ul class="chk"><li class="done">Открыть блокнот</li><li>Создать первую заметку</li></ul><table><tbody><tr><td>Задача</td><td>Срок</td></tr><tr><td>Пример</td><td>Сегодня</td></tr></tbody></table>'}]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes));localStorage.setItem('notes-del',JSON.stringify(tomb))}catch(e){}clearTimeout(save.t);save.t=setTimeout(push,800)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const txt=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.trim()};
function vis(){return notes.filter(n=>(flt==='all'||(flt==='today'?n.date===today():n.pri==flt))&&(!day||n.date===day)&&(!tagf||(n.tags||[]).includes(tagf))&&(!q||(n.title+' '+txt(n.html)).toLowerCase().includes(q))).sort((a,b)=>b.pri-a.pri||b.upd-a.upd)}
function chips(){const c=[['all','Все'],[3,'🔴 Высокий'],[2,'🟠 Средний'],[1,'🟢 Низкий'],['today','Сегодня']];
 $('#chips').innerHTML=c.map(([k,l])=>`<button class="chip ${flt==k?'on':''}" data-k="${k}">${l}</button>`).join('')+(day?`<button class="chip on" data-k="day">📅 ${day} ✕</button>`:'')+[...new Set(notes.flatMap(n=>n.tags||[]))].map(t=>`<button class="chip ${tagf==t?'on':''}" data-k="#${esc(t)}">#${esc(t)}</button>`).join('')}
function list(){{const k=notes.length,a=k%10,b=k%100;$('#cnt').textContent=k+' '+(b>10&&b<15?'заметок':a==1?'заметка':a>1&&a<5?'заметки':'заметок')+cloud}chips();
 const v=vis();$('#list').innerHTML=v.length?v.map(n=>`<div class="card p${n.pri} ${n.id===sel?'sel':''}" data-id="${n.id}"><b>${esc(n.title||'Без названия')}</b><small>${PN[n.pri]}${n.date?' · '+n.date+(n.time?' '+n.time:''):''}${(n.tags||[]).map(t=>' #'+esc(t)).join('')}</small><div class="pv">${esc(txt(n.html).slice(0,120))}</div></div>`).join(''):'<div class="empty">Здесь пока пусто</div>';
 if(tab==='cal')cal()}
function cal(){const y=cm.getFullYear(),m=cm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 const has=new Set(notes.map(x=>x.date));let h=`<div class="cn"><button data-m="-1">‹</button>${cm.toLocaleDateString('ru',{month:'long',year:'numeric'})}<button data-m="1">›</button></div><div class="cg">`+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<i>${d}</i>`).join('')+'<span></span>'.repeat(first);
 for(let d=1;d<=n;d++){const s=iso(new Date(y,m,d));h+=`<button data-d="${s}" class="${s===today()?'td':''} ${s===day?'on':''}">${d}${has.has(s)?'<b></b>':''}</button>`}
 $('#cal').innerHTML=h+'</div>'}
function openN(id){sel=id;const n=notes.find(x=>x.id===id);if(!n)return;$('#none')&&($('#none').remove());
 $('#ed').innerHTML=`<div class="top"><button class="btn g back" id="bk">‹ Назад</button><select id="pr">${[3,2,1].map(p=>`<option value="${p}" ${n.pri==p?'selected':''}>${PN[p]}</option>`).join('')}</select><input type="date" id="dt" value="${n.date||''}"><input type="time" id="tm" value="${n.time||''}"><span class="sp"></span><button class="btn" id="ex">Экспорт</button><button class="btn g" id="del">🗑</button></div>
 <div class="wrap"><input id="ttl" placeholder="Заголовок" value="${esc(n.title).replace(/"/g,'&quot;')}"><input id="tg" class="tg" placeholder="Теги через запятую: клиент, проект…" value="${esc((n.tags||[]).join(', ')).replace(/"/g,'&quot;')}"><div class="tools" id="tools">
 <button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="h">H</button><button data-c="insertUnorderedList">• Список</button><button data-c="insertOrderedList">1. Список</button><button data-c="chk">☑ Чек-лист</button><button data-c="tbl">▦ Таблица</button><button data-c="row">+ строка</button><button data-c="col">+ столбец</button></div>
 <div id="body" contenteditable="true"></div></div>`;
 $('#body').innerHTML=n.html;$('#app').dataset.v='ed';list()}
function cur(){return notes.find(x=>x.id===sel)}
function upd(){const n=cur();if(!n)return;n.title=$('#ttl').value;n.tags=$('#tg').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);n.html=$('#body').innerHTML;n.pri=+$('#pr').value;n.date=$('#dt').value;n.time=$('#tm').value;n.upd=Date.now();clearTimeout(upd.t);upd.t=setTimeout(()=>{save();list()},300)}
function newN(i=0){const T=TPL[i]||TPL[0],n={id:'n'+Date.now(),title:T.n,pri:2,date:day||'',time:'',tags:[],upd:Date.now(),html:T.h};notes.unshift(n);save();openN(n.id);setTimeout(()=>$('#ttl').focus(),50)}
document.addEventListener('mousedown',e=>{if(e.target.closest('#tools button'))e.preventDefault()});
document.addEventListener('click',e=>{const t=e.target,B=s=>t.closest(s);let b;
 if(b=B('.card'))openN(b.dataset.id);
 else if(b=B('.chip')){const k=b.dataset.k;if(k==='day')day=null;else if(k[0]==='#')tagf=tagf===k.slice(1)?null:k.slice(1);else flt=k==='all'||k==='today'?k:+k;list()}
 else if(b=B('[data-m]')){cm.setMonth(cm.getMonth()+ +b.dataset.m);cal()}
 else if(b=B('[data-d]')){day=day===b.dataset.d?null:b.dataset.d;list()}
 else if(B('#bk')){$('#app').dataset.v='list'}
 else if(B('#del')){if(confirm('Удалить заметку?')){tomb[sel]=Date.now();notes=notes.filter(x=>x.id!==sel);sel=null;save();$('#ed').innerHTML='<div class="none">Выберите заметку</div>';$('#app').dataset.v='list';list()}}
 else if(B('#new'))tplMenu();else if(b=B('[data-t]')){$('#ov').classList.remove('show');newN(+b.dataset.t)}else if(B('#imp'))$('#file').click();else if(B('#scb'))scOpen();else if(B('#stb'))stOpen();else if(B('#stsave'))stSave();else if(b=B('[data-sc]'))scAct(b.dataset.sc);
 else if(B('#ex'))exMenu(false);else if(B('#expAll'))exMenu(true);
 else if(B('#tl')){tab='list';$('#cal').hidden=true;$('#tl').className='on';$('#tc').className=''}
 else if(B('#tc')){tab='cal';$('#cal').hidden=false;$('#tc').className='on';$('#tl').className='';cal()}
 else if(t.id==='ov'||t.id==='sov')t.classList.remove('show');
 else if(b=B('#tools button'))tool(b.dataset.c);
 else if(t.tagName==='LI'&&t.parentNode.classList.contains('chk')&&e.offsetX<28){t.classList.toggle('done');upd()}
 else if(b=B('[data-x]')){$('#ov').classList.remove('show');exp(b.dataset.x)}});
document.addEventListener('input',e=>{if(e.target.closest('#ed'))upd()});
document.addEventListener('change',e=>{if(e.target.closest('.top'))upd()});
$('#q').oninput=e=>{q=e.target.value.toLowerCase();list()};
function tool(c){const b=$('#body');b.focus();const s=getSelection(),el=s.anchorNode&&(s.anchorNode.nodeType==3?s.anchorNode.parentNode:s.anchorNode);
 if(c==='h')document.execCommand('formatBlock',false,'H2');
 else if(c==='chk'){if(!(el&&el.closest('ul')))document.execCommand('insertUnorderedList');const u=getSelection().anchorNode;const ul=(u.nodeType==3?u.parentNode:u).closest('ul');if(ul)ul.classList.toggle('chk')}
 else if(c==='tbl')document.execCommand('insertHTML',false,'<table><tbody>'+'<tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>'.repeat(3)+'</tbody></table><div><br></div>');
 else if(c==='row'||c==='col'){const td=el&&el.closest('td');if(!td)return toast('Поставьте курсор в таблицу');
  if(c==='row'){const tr=td.parentNode,n=tr.cloneNode(true);n.querySelectorAll('td').forEach(x=>x.innerHTML='&nbsp;');tr.after(n)}
  else{const i=[...td.parentNode.children].indexOf(td);td.closest('table').querySelectorAll('tr').forEach(r=>{const x=document.createElement('td');x.innerHTML='&nbsp;';r.children[i].after(x)})}}
 else document.execCommand(c);upd()}
function exMenu(all){window._all=all;$('#sheet').innerHTML=`<h3>${all?'Экспорт всех заметок':'Экспорт заметки'}</h3>`+(all?'':'<button class="btn" data-x="pdf">📄 PDF</button><button class="btn" data-x="docx">📝 Word (.docx)</button>')+'<button class="btn" data-x="xlsx">📊 Excel (.xlsx)</button><button class="btn" data-x="json">💾 Резервная копия (.json)</button>';$('#ov').classList.add('show')}
const lsGet=k=>{try{return localStorage.getItem('nb-'+k)||''}catch(e){return''}},lsSet=(k,v)=>{try{v?localStorage.setItem('nb-'+k,v):localStorage.removeItem('nb-'+k)}catch(e){}};
async function dl(name,blob){try{const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
 if(/iPhone|iPad|Macintosh/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}catch(e){if(!e||e.name!=='AbortError')toast('Не удалось сохранить файл')}}
async function AI(prompt,{images,signal}){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(images)});
 let rs;try{rs=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':lsGet('apikey'),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:8000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:prompt}]}]})})}catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'offline'}}
 if(!rs.ok)throw{code:rs.status==401||rs.status==403?'not_granted':rs.status==429?'rate_limited':rs.status==400?'image_rejected':'upstream_error'};
